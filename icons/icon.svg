<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc0f7"/><stop offset="1" stop-color="#3b8fe0"/>
    </linearGradient>
    <g id="person"><circle cx="0" cy="-16" r="10" fill="#fff"/><path d="M-16 14 a16 16 0 0 1 32 0 v6 h-32z" fill="#fff"/></g>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- cross with rays -->
  <g stroke="#fff" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="48" x2="256" y2="160"/><line x1="230" y1="76" x2="282" y2="76"/>
  </g>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".95">
    <line x1="216" y1="120" x2="200" y2="96"/><line x1="296" y1="120" x2="312" y2="96"/>
    <line x1="228" y1="136" x2="206" y2="122"/><line x1="284" y1="136" x2="306" y2="122"/>
    <line x1="238" y1="150" x2="212" y2="146"/><line x1="274" y1="150" x2="300" y2="146"/>
    <line x1="220" y1="168" x2="292" y2="168"/><line x1="230" y1="180" x2="282" y2="180"/>
  </g>
  <!-- altar rail and altar -->
  <ellipse cx="256" cy="262" rx="160" ry="30" fill="none" stroke="#fff" stroke-width="10"/>
  <rect x="222" y="232" width="68" height="62" rx="4" fill="#fff"/>
  <rect x="216" y="224" width="80" height="14" rx="3" fill="#fff"/>
  <g stroke="#2f7fd6" stroke-width="7" stroke-linecap="round"><line x1="256" y1="248" x2="256" y2="284"/><line x1="244" y1="260" x2="268" y2="260"/></g>
  <!-- ministers around the altar -->
  <g transform="translate(0,0)">
    <use href="#person" transform="translate(120,222) scale(.8)"/><use href="#person" transform="translate(160,210) scale(.8)"/>
    <use href="#person" transform="translate(200,204) scale(.8)"/><use href="#person" transform="translate(312,204) scale(.8)"/>
    <use href="#person" transform="translate(352,210) scale(.8)"/><use href="#person" transform="translate(392,222) scale(.8)"/>
  </g>
  <!-- congregation -->
  <g>
    <use href="#person" transform="translate(96,330) scale(.75)"/><use href="#person" transform="translate(136,330) scale(.75)"/><use href="#person" transform="translate(176,330) scale(.75)"/>
    <use href="#person" transform="translate(80,376) scale(.75)"/><use href="#person" transform="translate(120,376) scale(.75)"/><use href="#person" transform="translate(160,376) scale(.75)"/><use href="#person" transform="translate(200,376) scale(.75)"/>
    <use href="#person" transform="translate(96,422) scale(.75)"/><use href="#person" transform="translate(136,422) scale(.75)"/><use href="#person" transform="translate(176,422) scale(.75)"/>
    <use href="#person" transform="translate(336,330) scale(.75)"/><use href="#person" transform="translate(376,330) scale(.75)"/><use href="#person" transform="translate(416,330) scale(.75)"/>
    <use href="#person" transform="translate(312,376) scale(.75)"/><use href="#person" transform="translate(352,376) scale(.75)"/><use href="#person" transform="translate(392,376) scale(.75)"/>
    <use href="#person" transform="translate(336,422) scale(.75)"/><use href="#person" transform="translate(376,422) scale(.75)"/>
  </g>
  <!-- calendar badge -->
  <circle cx="428" cy="428" r="52" fill="#fff"/><circle cx="428" cy="428" r="44" fill="#2f7fd6"/>
  <rect x="404" y="408" width="48" height="42" rx="5" fill="#fff"/><rect x="404" y="408" width="48" height="11" rx="3" fill="#dbe9f9"/>
  <g fill="#2f7fd6"><rect x="410" y="424" width="8" height="7"/><rect x="424" y="424" width="8" height="7"/><rect x="438" y="424" width="8" height="7"/><rect x="410" y="436" width="8" height="7"/><rect x="424" y="436" width="8" height="7"/></g>
  <circle cx="452" cy="452" r="14" fill="#fff"/><path d="M444 452 l6 6 l11 -12" fill="none" stroke="#2f7fd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
